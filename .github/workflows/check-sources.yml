name: Check source data for review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-review-candidate
          path: docs/data/candidate/
